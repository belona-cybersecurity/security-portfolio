    <text x="130" y="1166" fill="#5a6b7a" text-anchor="middle">asset &amp; data mapping</text>

    <rect x="230" y="1122" width="180" height="46" rx="5" fill="#e6f4ea" stroke="#2f855a"/>
    <text x="320" y="1139" font-size="11" font-weight="700" fill="#22543d" text-anchor="middle">PROTECT</text>
    <text x="320" y="1155" fill="#2f6b4a" text-anchor="middle">MFA · RBAC · rules ·</text>
