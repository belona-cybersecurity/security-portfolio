<svg viewBox="0 0 1040 1180" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
  <title>Cliente A — Security Architecture</title>
  <desc>Defense-in-depth security architecture on Firebase/GCP: a shift-left CI/CD pipeline, runtime defense in depth (prevention, detection), recovery, incident response, and mapping to NIST CSF, CIS Controls, OWASP, PASTA and Law 1581.</desc>
  <defs>
    <marker id="ari" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a6b7a"/>
    </marker>
    <marker id="arh" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a5a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1180" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="40" font-size="24" font-weight="700" fill="#1a3a5c">Cliente A — Security Architecture</text>
  <text x="40" y="63" font-size="13.5" fill="#5a6b7a">Defense in depth on Firebase / Google Cloud · Full AAA coverage · Structured around NIST CSF (see foot)</text>

  <!-- Legend -->
  <rect x="40" y="78" width="13" height="13" fill="#2f855a"/><text x="59" y="89" font-size="12" fill="#2d3748">Prevention</text>
  <rect x="150" y="78" width="13" height="13" fill="#b7791f"/><text x="169" y="89" font-size="12" fill="#2d3748">Detection</text>
  <rect x="252" y="78" width="13" height="13" fill="#6b46c1"/><text x="271" y="89" font-size="12" fill="#2d3748">Recovery</text>
  <rect x="352" y="78" width="13" height="13" fill="#4a6fa5"/><text x="371" y="89" font-size="12" fill="#2d3748">Compute / data flow</text>

  <!-- ============ BAND 1: CI/CD PIPELINE (shift-left) ============ -->
  <rect x="40" y="104" width="960" height="104" rx="8" fill="#f4f7fb" stroke="#3a5a8a" stroke-width="1.5"/>
  <text x="56" y="128" font-size="15" font-weight="700" fill="#1a3a5c">① Secure delivery pipeline — shift-left (DevSecOps · IaC)</text>

  <rect x="56" y="140" width="140" height="44" rx="5" fill="#ffffff" stroke="#8aa2c4"/>
  <text x="126" y="160" font-size="12" font-weight="600" fill="#1a3a5c" text-anchor="middle">Local dev</text>
  <text x="126" y="176" font-size="10" fill="#5a6b7a" text-anchor="middle">code · rules · headers</text>

  <line x1="196" y1="162" x2="222" y2="162" stroke="#3a5a8a" stroke-width="1.5" marker-end="url(#arh)"/>
  <rect x="224" y="140" width="150" height="44" rx="5" fill="#ffffff" stroke="#8aa2c4"/>
  <text x="299" y="160" font-size="12" font-weight="600" fill="#1a3a5c" text-anchor="middle">GitHub repo</text>
  <text x="299" y="176" font-size="10" fill="#5a6b7a" text-anchor="middle">git push · version control</text>

  <line x1="374" y1="162" x2="400" y2="162" stroke="#3a5a8a" stroke-width="1.5" marker-end="url(#arh)"/>
  <rect x="402" y="140" width="264" height="44" rx="5" fill="#eaf4ee" stroke="#2f855a"/>
  <text x="534" y="158" font-size="12" font-weight="600" fill="#22543d" text-anchor="middle">GitHub Actions — CI security gates</text>
  <text x="534" y="175" font-size="10" fill="#2f6b4a" text-anchor="middle">Dependabot · npm audit (blocks high/critical) · FIM (SHA-256, 6h)</text>

  <line x1="666" y1="162" x2="692" y2="162" stroke="#3a5a8a" stroke-width="1.5" marker-end="url(#arh)"/>
  <rect x="694" y="140" width="130" height="44" rx="5" fill="#ffffff" stroke="#8aa2c4"/>
  <text x="759" y="160" font-size="12" font-weight="600" fill="#1a3a5c" text-anchor="middle">firebase deploy</text>
  <text x="759" y="176" font-size="10" fill="#5a6b7a" text-anchor="middle">rules &amp; config as code</text>

  <line x1="824" y1="162" x2="850" y2="162" stroke="#3a5a8a" stroke-width="1.5" marker-end="url(#arh)"/>
  <rect x="852" y="140" width="132" height="44" rx="5" fill="#e6f4ea" stroke="#2f855a"/>
  <text x="918" y="160" font-size="12" font-weight="600" fill="#22543d" text-anchor="middle">Production</text>
  <text x="918" y="176" font-size="10" fill="#2f6b4a" text-anchor="middle">Hosting + Functions</text>

  <text x="56" y="200" font-size="10.5" fill="#5a6b7a">Secrets in Secret Manager / GitHub Secrets — never committed · least-privilege service accounts · deploys are reproducible (infrastructure as code)</text>

  <!-- ============ BAND 2: RUNTIME DEFENSE IN DEPTH ============ -->
  <text x="40" y="238" font-size="15" font-weight="700" fill="#1a3a5c">② Runtime — defense in depth</text>

  <!-- users -->
  <rect x="60" y="252" width="270" height="46" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="195" y="272" font-size="13.5" font-weight="600" fill="#1a3a5c" text-anchor="middle">Public visitors</text>
  <text x="195" y="289" font-size="10.5" fill="#5a6b7a" text-anchor="middle">website · contact form</text>
  <rect x="360" y="252" width="270" height="46" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="495" y="272" font-size="13.5" font-weight="600" fill="#1a3a5c" text-anchor="middle">Admin users</text>
  <text x="495" y="289" font-size="10.5" fill="#5a6b7a" text-anchor="middle">lawyers · editors · admin</text>

  <line x1="195" y1="298" x2="195" y2="324" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>
  <line x1="495" y1="298" x2="495" y2="324" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>

  <!-- hosting -->
  <rect x="60" y="326" width="570" height="48" rx="6" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
  <text x="345" y="346" font-size="13.5" font-weight="600" fill="#22543d" text-anchor="middle">Firebase Hosting</text>
  <text x="345" y="364" font-size="10.5" fill="#2f6b4a" text-anchor="middle">Security headers · CSP · X-Frame-Options · .git &amp; source blocked (pentest fix)</text>

  <line x1="195" y1="374" x2="195" y2="400" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>
  <line x1="495" y1="374" x2="495" y2="400" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>

  <!-- gates -->
  <rect x="60" y="402" width="270" height="48" rx="6" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
  <text x="195" y="422" font-size="12.5" font-weight="600" fill="#22543d" text-anchor="middle">App Check</text>
  <text x="195" y="439" font-size="10.5" fill="#2f6b4a" text-anchor="middle">reCAPTCHA v3 (enforced)</text>
  <rect x="360" y="402" width="270" height="48" rx="6" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
  <text x="495" y="422" font-size="12.5" font-weight="600" fill="#22543d" text-anchor="middle">Firebase Auth · MFA/TOTP</text>
  <text x="495" y="439" font-size="10.5" fill="#2f6b4a" text-anchor="middle">multi-factor login</text>

  <line x1="195" y1="450" x2="195" y2="476" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>
  <line x1="495" y1="450" x2="495" y2="476" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>

  <!-- RBAC -->
  <rect x="60" y="478" width="570" height="48" rx="6" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
  <text x="345" y="498" font-size="13.5" font-weight="600" fill="#22543d" text-anchor="middle">RBAC — custom claims (least privilege)</text>
  <text x="345" y="516" font-size="10.5" fill="#2f6b4a" text-anchor="middle">admin (full) · abogado/lawyer (content, cases) · editor (blog only)</text>

  <line x1="345" y1="526" x2="345" y2="552" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>

  <!-- Functions -->
  <rect x="60" y="554" width="570" height="66" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="345" y="573" font-size="12.5" font-weight="600" fill="#1a3a5c" text-anchor="middle">Cloud Functions (gen2 · Node 24) — server-side validation</text>
  <rect x="75" y="580" width="170" height="30" rx="4" fill="#ffffff" stroke="#a9bcd4"/>
  <text x="160" y="599" font-size="10.5" fill="#2d3748" text-anchor="middle">enviarConsulta</text>
  <rect x="260" y="580" width="170" height="30" rx="4" fill="#ffffff" stroke="#a9bcd4"/>
  <text x="345" y="599" font-size="10.5" fill="#2d3748" text-anchor="middle">auditarSituacion</text>
  <rect x="445" y="580" width="170" height="30" rx="4" fill="#ffffff" stroke="#a9bcd4"/>
  <text x="530" y="599" font-size="10.5" fill="#2d3748" text-anchor="middle">admin* (role-guarded)</text>

  <line x1="345" y1="620" x2="345" y2="646" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>

  <!-- rules -->
  <rect x="60" y="648" width="570" height="44" rx="6" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
  <text x="345" y="675" font-size="12.5" font-weight="600" fill="#22543d" text-anchor="middle">Firestore &amp; Storage Security Rules (server-side authorization)</text>

  <line x1="145" y1="692" x2="145" y2="718" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>
  <line x1="345" y1="692" x2="345" y2="718" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>
  <line x1="530" y1="692" x2="530" y2="718" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>

  <!-- data -->
  <rect x="60" y="720" width="170" height="54" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="145" y="741" font-size="12" font-weight="600" fill="#1a3a5c" text-anchor="middle">Firestore</text>
  <text x="145" y="758" font-size="10" fill="#5a6b7a" text-anchor="middle">app data · audit log</text>
  <rect x="260" y="720" width="170" height="54" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="345" y="741" font-size="12" font-weight="600" fill="#1a3a5c" text-anchor="middle">Storage (private)</text>
  <text x="345" y="758" font-size="10" fill="#5a6b7a" text-anchor="middle">getBlob · no public URLs</text>
  <rect x="445" y="720" width="170" height="54" rx="6" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="530" y="741" font-size="12" font-weight="600" fill="#1a3a5c" text-anchor="middle">Secret Manager</text>
  <text x="530" y="758" font-size="10" fill="#5a6b7a" text-anchor="middle">API keys · SMTP pass</text>

  <line x1="145" y1="774" x2="145" y2="798" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>
  <line x1="530" y1="774" x2="530" y2="798" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#ari)"/>
  <rect x="60" y="800" width="230" height="38" rx="6" fill="#f5f0fa" stroke="#8a6bbf" stroke-width="1.2"/>
  <text x="175" y="824" font-size="11" fill="#4a2f7a" text-anchor="middle">Gmail SMTP → legal@ (nodemailer)</text>
  <rect x="400" y="800" width="230" height="38" rx="6" fill="#f5f0fa" stroke="#8a6bbf" stroke-width="1.2"/>
  <text x="515" y="824" font-size="11" fill="#4a2f7a" text-anchor="middle">Gemini API (AI auditor proxy)</text>

  <!-- Detection panel (right) -->
  <rect x="700" y="252" width="284" height="440" rx="8" fill="#fdf6e9" stroke="#b7791f" stroke-width="1.5"/>
  <text x="842" y="278" font-size="15" font-weight="700" fill="#8a5a12" text-anchor="middle">DETECTION</text>

  <rect x="716" y="292" width="252" height="70" rx="6" fill="#ffffff" stroke="#d9b26a"/>
  <text x="842" y="313" font-size="12" font-weight="600" fill="#8a5a12" text-anchor="middle">File Integrity Monitoring</text>
  <text x="842" y="330" font-size="10" fill="#6b5518" text-anchor="middle">SHA-256 of 13 live files · every 6h</text>
  <text x="842" y="346" font-size="10" fill="#6b5518" text-anchor="middle">GitHub Actions → Telegram alerts</text>

  <rect x="716" y="372" width="252" height="70" rx="6" fill="#ffffff" stroke="#d9b26a"/>
  <text x="842" y="393" font-size="12" font-weight="600" fill="#8a5a12" text-anchor="middle">Cloud Monitoring</text>
  <text x="842" y="410" font-size="10" fill="#6b5518" text-anchor="middle">log-based alert (Functions ≥ ERROR)</text>
  <text x="842" y="426" font-size="10" fill="#6b5518" text-anchor="middle">→ email + SMS</text>

  <rect x="716" y="452" width="252" height="70" rx="6" fill="#ffffff" stroke="#d9b26a"/>
  <text x="842" y="473" font-size="12" font-weight="600" fill="#8a5a12" text-anchor="middle">Supply chain</text>
  <text x="842" y="490" font-size="10" fill="#6b5518" text-anchor="middle">Dependabot · npm audit CI gate</text>
  <text x="842" y="506" font-size="10" fill="#6b5518" text-anchor="middle">blocks high / critical vulns</text>

  <rect x="716" y="532" width="252" height="82" rx="6" fill="#ffffff" stroke="#d9b26a"/>
  <text x="842" y="553" font-size="12" font-weight="600" fill="#8a5a12" text-anchor="middle">Accounting / Audit (the 3rd A)</text>
  <text x="842" y="570" font-size="10" fill="#6b5518" text-anchor="middle">append-only `auditoria` collection</text>
  <text x="842" y="586" font-size="10" fill="#6b5518" text-anchor="middle">admin access log · server-side</text>
  <text x="842" y="602" font-size="10" fill="#6b5518" text-anchor="middle">tamper-evident</text>

  <text x="842" y="642" font-size="10.5" fill="#8a5a12" text-anchor="middle" font-style="italic">Continuous verification —</text>
  <text x="842" y="658" font-size="10.5" fill="#8a5a12" text-anchor="middle" font-style="italic">validated live (alert fired</text>
  <text x="842" y="674" font-size="10.5" fill="#8a5a12" text-anchor="middle" font-style="italic">on real error events)</text>

  <!-- ============ BAND 3: RECOVERY ============ -->
  <rect x="40" y="858" width="944" height="78" rx="8" fill="#f5f0fa" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="66" y="885" font-size="15" font-weight="700" fill="#4a2f7a">③ Recovery — 3-2-1 backup strategy (RPO/RTO defined)</text>
  <rect x="66" y="896" width="205" height="30" rx="4" fill="#ffffff" stroke="#b79bd6"/>
  <text x="168" y="916" font-size="10.5" fill="#4a2f7a" text-anchor="middle">Firestore PITR (7 days)</text>
  <rect x="286" y="896" width="205" height="30" rx="4" fill="#ffffff" stroke="#b79bd6"/>
  <text x="388" y="916" font-size="10.5" fill="#4a2f7a" text-anchor="middle">Daily backups (14 days)</text>
  <rect x="506" y="896" width="205" height="30" rx="4" fill="#ffffff" stroke="#b79bd6"/>
  <text x="608" y="916" font-size="10.5" fill="#4a2f7a" text-anchor="middle">Storage object versioning</text>
  <rect x="726" y="896" width="242" height="30" rx="4" fill="#ffffff" stroke="#b79bd6"/>
  <text x="847" y="916" font-size="10.5" fill="#4a2f7a" text-anchor="middle">Offsite weekly export (region us)</text>

  <!-- ============ BAND 4: RESPONSE + STANDARDS ============ -->
  <rect x="40" y="958" width="944" height="82" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="66" y="985" font-size="15" font-weight="700" fill="#8a2820">④ Response — NIST-based incident response</text>
  <rect x="66" y="996" width="900" height="30" rx="4" fill="#ffffff" stroke="#e0a49c"/>
  <text x="516" y="1016" font-size="11" fill="#8a2820" text-anchor="middle">5 playbooks: data breach · site defacement · data loss · account compromise · DoS  —  with escalation paths &amp; alert channels</text>

  <!-- Frameworks strip -->
  <text x="40" y="1074" font-size="13.5" font-weight="700" fill="#1a3a5c">Frameworks &amp; standards applied</text>
  <g font-size="11" fill="#ffffff">
    <rect x="40" y="1084" width="150" height="26" rx="13" fill="#1a3a5c"/><text x="115" y="1101" text-anchor="middle">NIST CSF</text>
    <rect x="200" y="1084" width="150" height="26" rx="13" fill="#1a3a5c"/><text x="275" y="1101" text-anchor="middle">CIS Controls v8</text>
    <rect x="360" y="1084" width="120" height="26" rx="13" fill="#1a3a5c"/><text x="420" y="1101" text-anchor="middle">OWASP</text>
    <rect x="490" y="1084" width="200" height="26" rx="13" fill="#1a3a5c"/><text x="590" y="1101" text-anchor="middle">PASTA threat model</text>
    <rect x="700" y="1084" width="284" height="26" rx="13" fill="#1a3a5c"/><text x="842" y="1101" text-anchor="middle">Law 1581 / GDPR-style consent</text>
  </g>

  <!-- NIST CSF mapping row -->
  <g font-size="10">
    <rect x="40" y="1122" width="180" height="46" rx="5" fill="#eef2f7" stroke="#4a6fa5"/>
    <text x="130" y="1139" font-size="11" font-weight="700" fill="#1a3a5c" text-anchor="middle">IDENTIFY</text>
