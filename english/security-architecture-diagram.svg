    <rect x="420" y="1122" width="180" height="46" rx="5" fill="#fdf6e9" stroke="#b7791f"/>
    <text x="510" y="1139" font-size="11" font-weight="700" fill="#8a5a12" text-anchor="middle">DETECT</text>
    <text x="510" y="1155" fill="#6b5518" text-anchor="middle">FIM · log alerts ·</text>
    <text x="510" y="1166" fill="#6b5518" text-anchor="middle">Dependabot · audit log</text>

    <rect x="610" y="1122" width="180" height="46" rx="5" fill="#fdecec" stroke="#c0392b"/>
    <text x="700" y="1139" font-size="11" font-weight="700" fill="#8a2820" text-anchor="middle">RESPOND</text>
    <text x="700" y="1155" fill="#8a2820" text-anchor="middle">5 NIST IR playbooks ·</text>
    <text x="700" y="1166" fill="#8a2820" text-anchor="middle">alert channels</text>

    <rect x="800" y="1122" width="184" height="46" rx="5" fill="#f5f0fa" stroke="#6b46c1"/>
    <text x="892" y="1139" font-size="11" font-weight="700" fill="#4a2f7a" text-anchor="middle">RECOVER</text>
